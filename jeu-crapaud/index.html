<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a13"><meta name="robots" content="noindex">
<title>Le Détour du Crapaud · Au fil des nuits</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a13;color:#eee5d4}body{font:16px Georgia,serif}#canvas{display:block;width:100%;height:100%;image-rendering:pixelated;outline:none}#intro{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:28px;background:#070a13;transition:opacity .25s}#intro[hidden]{display:none}#words{opacity:0;transition:opacity .4s}#intro.ready #words{opacity:1}h1{font-size:clamp(32px,6vw,58px);font-weight:400;color:#e8c482;margin:0 0 22px}p{font-size:clamp(15px,2.4vw,23px);margin:0 0 36px}button{padding:16px 26px;border:1px solid #69746a;background:#24313f;color:#e8c482;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:#344e4d;outline:2px solid #e8c482;outline-offset:4px}button:disabled{cursor:wait;opacity:.7}#note{min-height:24px;margin-top:18px;font-size:15px;color:#acb6b3}#canvas:focus-visible{outline:2px solid #e8c482;outline-offset:-3px}
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Jeu du crapaud. Flèches gauche et droite pour avancer, flèche du haut pour sauter. Échap pour mettre en pause."></canvas>
<section id="intro" aria-live="polite"><div id="words"><h1 id="headline">Oups…</h1><p id="message">Je crois que tu as cassé le site.</p><button type="button" id="return">Retourner sur le site</button><div id="note" role="status"></div></div></section>
<script src="index.js"></script>
<script>
(function(){
 'use strict';
 var key='au-fil-des-nuits.crapaud.completed.v1',canvas=document.getElementById('canvas'),intro=document.getElementById('intro'),button=document.getElementById('return'),note=document.getElementById('note');
 var engineReady=false,wantsStart=false,failed=false,completed=false;
 try {if(performance.getEntriesByType('navigation')[0]?.type==='reload')sessionStorage.removeItem(key);completed=sessionStorage.getItem(key)==='1';}catch(e){}
 function returnToPhotos(){
   var target=new URL('../photos.html',location.href);
   try {var saved=new URL(sessionStorage.getItem('crapaud_return_url')||target.href,location.href);if(saved.origin===location.origin&&saved.pathname.endsWith('/photos.html'))target=saved;}catch(e){}
   location.assign(target.href);
 }
 window.CrapaudPage={returnToPhotos:returnToPhotos,showGame:function(){intro.hidden=true;canvas.focus({preventScroll:true});}};
 setTimeout(function(){intro.classList.add('ready');},1000);
 if(completed){document.getElementById('headline').textContent='Le crapaud se repose.';document.getElementById('message').textContent='Une petite pause bien méritée. F5 pour rejouer !';button.textContent='Revenir aux photos';button.onclick=returnToPhotos;return;}
 button.addEventListener('click',function(){
   if(failed){returnToPhotos();return;}
   wantsStart=true;button.disabled=true;
   if(engineReady)window.__crapaudStartRequested=true;else note.textContent='Le crapaud arrive…';
 });
 // Le moteur reste léger à transférer, même sur l'hébergement statique GitHub.
 var nativeFetch=window.fetch.bind(window);
 window.fetch=async function(input,options){
   var raw=typeof input==='string'?input:input.url,url=new URL(raw,location.href);
   if(url.origin===location.origin&&url.pathname.endsWith('/index.wasm')){
     var response=await nativeFetch('index.wasm.gz?v=fc74679e3b97',options);
     if(!response.ok)return response;
     if(typeof DecompressionStream!=='function')throw Error('Navigateur non compatible');
     return new Response(response.body.pipeThrough(new DecompressionStream('gzip')),{headers:{'Content-Type':'application/wasm','Content-Length':'39514754'}});
   }
   if(url.origin===location.origin&&url.pathname.endsWith('/index.pck')){url.searchParams.set('v','951b451d3cc7');return nativeFetch(url.href,options);}
   return nativeFetch(input,options);
 };
 var config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":25696,"index.wasm":39514754},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4};
 var missing=Engine.getMissingFeatures?Engine.getMissingFeatures({threads:false}):[];
 if(missing.length){failure();return;}
 var engine=new Engine(config);
 engine.startGame({canvas:canvas,focusCanvas:false}).then(function(){engineReady=true;if(wantsStart)window.__crapaudStartRequested=true;}).catch(failure);
 function failure(error){failed=true;button.disabled=false;document.getElementById('headline').textContent='Le crapaud reste au bord de l’eau.';document.getElementById('message').textContent='Le jeu ne peut pas démarrer dans ce navigateur.';button.textContent='Revenir aux photos';note.textContent='';intro.hidden=false;intro.classList.add('ready');if(error)console.error(error);}
 window.addEventListener('keydown',function(e){if(intro.hidden&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();},{passive:false});
})();
</script>
</body></html>
