<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune — Photos</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg-deep:#060814;--gold:#e8c17a;--gold-soft:#f0d9a8;--ink:#eef0f8;--ink-dim:#a9adc4;--line:rgba(232,193,122,0.18);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    color:var(--ink);font-family:'Work Sans',sans-serif;min-height:100vh;
    background:
      linear-gradient(180deg, rgba(6,8,20,0.88) 0%, rgba(6,8,20,0.75) 40%, rgba(6,8,20,0.94) 100%),
      url('bg-lake.jpg');
    background-size:cover; background-position:center; background-attachment:fixed;
    overflow-x:hidden;
  }
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 5vw;background:linear-gradient(to bottom,rgba(6,8,20,0.75),transparent);backdrop-filter:blur(2px);}
  .brand{font-family:'Cormorant Garamond',serif;font-size:1.5rem;letter-spacing:0.06em;color:var(--gold-soft);font-weight:600;text-decoration:none;}
  .navlinks{list-style:none;display:flex;gap:2.6rem;}
  .navlinks a{color:var(--ink-dim);text-decoration:none;font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;font-weight:500;}
  .navlinks a.active{color:var(--gold-soft);}
  .navlinks a:hover{color:var(--ink);}

  main{min-height:100vh;position:relative;padding-top:73px;}

  /* ---------- Sélection des albums ---------- */
  #albumView{min-height:calc(100vh - 73px);display:grid;grid-template-rows:auto 1fr;align-items:center;justify-items:center;gap:clamp(1rem,3vh,2rem);padding:1.4rem 5vw 2rem;transition:opacity .5s ease,visibility .5s;}
  #albumView.hidden{opacity:0;visibility:hidden;position:absolute;inset:0;pointer-events:none;}
  .photos-intro{text-align:center;transform:translateY(clamp(24px,8vh,100px));}
  .photos-intro .eyebrow{margin-bottom:.55rem;color:var(--gold);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;}
  .photos-intro h1{color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2rem,3.4vw,3rem);font-weight:500;line-height:1.05;}
  .photos-intro .intro-copy{margin-top:.55rem;color:var(--ink-dim);font-size:.82rem;letter-spacing:.03em;}
  .frog-inline{padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;vertical-align:baseline;}
  .frog-inline:focus-visible{outline:1px solid var(--gold);outline-offset:3px;border-radius:3px;}
  .album-choices{display:flex;align-items:center;justify-content:center;gap:min(14vw,10rem);width:100%;}
  .album-wrap{display:flex;flex-direction:column;align-items:center;gap:.9rem;}
  .album{position:relative;width:min(230px,25vw);height:clamp(210px,38vh,290px);cursor:pointer;}
  .album-label{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.3rem,2vw,1.75rem);color:var(--gold-soft);letter-spacing:.01em;}
  .polaroid{position:absolute;top:0;left:0;width:100%;height:100%;padding:9px 9px 35px;border:1px solid rgba(255,255,255,.52);border-radius:3px;background:#f3efe4;box-shadow:0 16px 38px rgba(0,0,0,.45);transition:transform .9s cubic-bezier(.2,1,.3,1),box-shadow .6s;}
  .polaroid .photo-area{width:100%;height:100%;overflow:hidden;border-radius:1px;background:#11142a;}
  .polaroid .photo-area img{display:block;width:100%;height:100%;object-fit:cover;}
  .album-emoji{position:absolute;z-index:20;right:-.7rem;bottom:1.4rem;display:grid;width:clamp(48px,6vw,70px);aspect-ratio:1;place-items:center;border:1px solid rgba(255,255,255,.38);border-radius:50%;background:rgba(15,19,29,.88);box-shadow:0 8px 28px rgba(0,0,0,.35);font-size:clamp(1.6rem,2.8vw,2.2rem);}
  .album:hover .polaroid{box-shadow:0 18px 40px rgba(0,0,0,.55);}
  .album.bloomed{cursor:default;}
  @media(max-width:720px){
    nav{grid-template-columns:1fr auto 1fr;padding:16px 4vw;}
    .brand{font-size:1.2rem;}
    .navlinks{justify-self:center;gap:clamp(.45rem,2.2vw,.9rem);}
    .navlinks a{font-size:clamp(.5rem,1.8vw,.65rem);}
    #albumView{gap:1rem;padding:1rem 4vw 1.5rem;}
    .photos-intro .eyebrow{font-size:.57rem;}
    .photos-intro .intro-copy{font-size:.72rem;}
    .album-choices{gap:clamp(1.2rem,8vw,4rem);}
    .album{width:min(38vw,180px);height:clamp(160px,29vh,230px);}
    .album-wrap{gap:.65rem;}
    .album-emoji{right:-.45rem;bottom:1rem;}
  }
  /* ---------- Vue galerie (stockage) ---------- */
  #galleryView{
    display:none; box-sizing:border-box; height:calc(100vh - 73px); min-height:0;
    grid-template-rows:auto auto minmax(0,1fr); gap:1rem; overflow:hidden; padding:1.2rem 5vw 1.3rem;
  }
  #galleryView.visible{display:grid;}
  .gallery-header{display:flex;align-items:center;gap:1.2rem;min-width:0;}
  .back-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-family:'Work Sans',sans-serif; font-size:0.78rem; letter-spacing:0.08em;
    text-transform:uppercase; padding:0.55rem 1.1rem; cursor:pointer;
    transition:color 0.2s, border-color 0.2s;
  }
  .back-btn:hover{color:var(--gold-soft); border-color:var(--gold);}
  .gallery-title{
    font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:400;
    font-size:1.6rem; color:var(--gold-soft);
  }
  /* --- Onglets filtres --- */
  .filter-tabs{display:flex;gap:.7rem;margin:0;flex-wrap:wrap;}
  .filter-tab{
    display:flex; align-items:center; gap:0.5rem;
    border:1px solid var(--line); background:rgba(255,255,255,0.02);
    color:var(--ink-dim); font-family:'Work Sans',sans-serif;
    font-size:0.76rem; letter-spacing:0.05em;
    padding:0.5rem 1rem; cursor:pointer; transition:border-color 0.2s, color 0.2s, background 0.2s;
  }
  .filter-tab .tab-emoji{font-size:0.95rem;}
  .filter-tab:hover{color:var(--ink); border-color:var(--gold);}
  .filter-tab.active{color:var(--gold-soft); border-color:var(--gold); background:rgba(232,193,122,0.08);}

  .gallery-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:.75rem;align-content:center;min-height:0;overflow:hidden;}
  .gallery-card{position:relative;height:100%;min-height:0;border:1px solid var(--line);background:rgba(255,255,255,.03);overflow:hidden;cursor:pointer;transition:transform .35s ease,border-color .3s;display:flex;align-items:center;justify-content:center;}
  .gallery-card img{width:100%;height:100%;object-fit:contain;display:block;background:rgba(6,8,20,.45);transition:transform .5s ease;}
  .gallery-card:hover{transform:scale(1.035);border-color:var(--gold);}
  .gallery-card:hover img{transform:scale(1.08);}
  @media(max-width:1440px) and (min-width:721px){.gallery-grid{grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:.65rem;}}
  .gallery-pagination{grid-column:4/span 2;grid-row:3;align-self:center;display:flex;align-items:center;justify-content:center;gap:clamp(.4rem,1vw,1.2rem);min-width:0;color:var(--ink-dim);font-size:.72rem;letter-spacing:.08em;}
  .gallery-pagination[hidden]{display:none;}
  .gallery-pagination button{border:1px solid var(--line);padding:.45rem .85rem;background:rgba(255,255,255,.02);color:var(--gold-soft);font:inherit;cursor:pointer;}
  .gallery-pagination button:hover:not(:disabled){border-color:var(--gold);background:rgba(232,193,122,.08);}
  .gallery-pagination button:disabled{opacity:.35;cursor:default;}
  .gallery-loading, .gallery-empty{
    grid-column:1/-1; text-align:center; color:var(--ink-dim);
    font-style:italic; font-family:'Cormorant Garamond',serif; font-size:1.1rem;
    padding:3rem 0;
  }

  /* --- Lightbox --- */
  #lightbox{
    display:none; position:fixed; inset:0; z-index:200;
    background:rgba(3,4,10,0.92); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:5vw;
  }
  #lightbox.visible{display:flex;}
  .lightbox-content{
    background:#0d1024; border:1px solid var(--line);
    min-width:min(300px,90vw); max-width:min(720px,90vw); max-height:95vh;
    display:flex; flex-direction:column; align-items:center;
    position:relative; overflow:hidden;
  }
  .lightbox-toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;padding:.55rem .7rem;}
  .zoom-controls{display:flex;align-items:center;gap:.35rem;}
  .zoom-controls button{display:grid;place-items:center;width:2rem;height:2rem;border:1px solid var(--line);background:transparent;color:var(--gold-soft);font:inherit;font-size:1.1rem;cursor:pointer;}
  .zoom-controls button:disabled{opacity:.35;cursor:default;}
  .zoom-controls output{min-width:2.8rem;text-align:center;font-size:.75rem;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
  .zoom-controls button:focus-visible,.lightbox-close:focus-visible{outline:1px solid var(--gold);outline-offset:3px;}
  .image-viewport{position:relative;flex:none;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:zoom-in;}
  .image-viewport:focus-visible{outline:1px solid var(--gold);outline-offset:-2px;}
  .image-viewport.zoomed{cursor:grab;}
  .image-viewport.dragging{cursor:grabbing;}
  .lightbox-content .image-viewport img{width:100%;height:100%;object-fit:contain;display:block;transform-origin:center;pointer-events:none;-webkit-user-drag:none;}
  .lb-caption{ padding:1rem 1.4rem 1.2rem; text-align:center; }
  .lightbox-content .lb-sub{font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:1.25rem; color:var(--gold-soft);}
  .lightbox-content .lb-date{font-size:0.78rem; color:var(--ink-dim); margin-top:0.3rem;}
  .lightbox-close{
    flex:none; background:none; border:none;
    color:var(--ink-dim); font-size:0.72rem; letter-spacing:0.05em; text-transform:uppercase;
    cursor:pointer; padding:0.4rem;
  }
  .lightbox-close:hover{color:var(--gold-soft);}
  #lbImg{transition:opacity .2s ease;}
  #lbImg.loading{opacity:.35;}
  .lb-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:3.2rem; height:3.2rem; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(6,8,20,.6); border:1px solid var(--line); color:var(--ink-dim);
    cursor:pointer; transition:color .2s, border-color .2s, background .2s;
  }
  .lb-arrow:hover{color:var(--gold-soft); border-color:var(--gold); background:rgba(232,193,122,.1);}
  .lb-arrow[hidden]{display:none;}
  .lb-arrow svg{width:1.3rem; height:1.3rem;}
  #lbPrev{left:max(1rem,3vw);}
  #lbNext{right:max(1rem,3vw);}
  @media (max-width:720px){
    .lb-arrow{width:2.6rem; height:2.6rem;}
    .zoom-controls button{width:2.5rem;height:2.5rem;}
    #lbPrev{left:.5rem;} #lbNext{right:.5rem;}
  }

  @media (max-width:720px){
    .gallery-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:.45rem;}
    #galleryView{gap:.65rem;padding:.65rem 4vw .8rem;}
    .gallery-header{gap:.7rem;}
    .gallery-card{height:100%;}
    .gallery-pagination{grid-column:2/span 2;grid-row:6;gap:.4rem;font-size:.65rem;}
    .gallery-pagination button{padding:.4rem .65rem;}
    .filter-tabs{gap:0.5rem;}
    .filter-tab{font-size:0.68rem; padding:0.4rem 0.75rem;}
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">Lune</a>
  <ul class="navlinks">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="photos.html" class="active">Photos</a></li>
    <li><a href="materiel.html">Matériel</a></li>
    <li><a href="widget.html">Widget</a></li>
  </ul>
</nav>

<main>

  <div id="albumView">
    <section class="photos-intro">
      <p class="eyebrow">AU FIL DES NUITS <button class="frog-inline" type="button" data-crapaud aria-label="Lancer l’easter egg du crapaud" title="Un petit secret…">🐸</button></p>
      <h1>Mes photographies</h1>
      <p class="intro-copy">Deux albums, quelques instants capturés.</p>
    </section>
    <div class="album-choices">
      <div class="album-wrap">
        <div class="album" id="albumLune" data-category="lune" role="button" tabindex="0" aria-label="Ouvrir l’album de la Lune"></div>
        <div class="album-label">La Lune</div>
      </div>
      <div class="album-wrap">
        <div class="album" id="albumNature" data-category="nature" role="button" tabindex="0" aria-label="Ouvrir l’album de la Nature"></div>
        <div class="album-label">La Nature</div>
      </div>
    </div>
  </div>
  <div id="galleryView">
    <div class="gallery-header">
      <button class="back-btn" id="backBtn">← Retour</button>
      <div class="gallery-title" id="galleryTitle">—</div>
    </div>
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="gallery-pagination" id="galleryPagination" hidden>
      <button type="button" id="previousPage" aria-label="Page précédente">←</button>
      <span id="pageIndicator">1 / 1</span>
      <button type="button" id="nextPage" aria-label="Page suivante">→</button>
    </div>
  </div>

</main>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photographie agrandie">
  <div class="lightbox-content">
    <div class="lightbox-toolbar">
      <div class="zoom-controls" role="group" aria-label="Zoom de la photographie">
        <button type="button" id="zoomOut" aria-label="Réduire le zoom" title="Réduire le zoom (−)">−</button>
        <output id="zoomLevel" aria-label="Niveau de zoom">1×</output>
        <button type="button" id="zoomIn" aria-label="Agrandir la photographie" title="Agrandir (+)">+</button>
        <button type="button" id="zoomReset" aria-label="Revenir à la photo entière" title="Revenir à la photo entière (0)">↺</button>
      </div>
      <button type="button" class="lightbox-close" id="lightboxClose">✕ Fermer</button>
    </div>
    <div class="image-viewport" id="imageViewport" tabindex="0" aria-label="Photo : clic gauche pour zoomer, clic droit pour dézoomer, molette ou pincement sur téléphone, puis glisser pour déplacer">
      <img id="lbImg" src="" alt="" draggable="false">
    </div>
    <div class="lb-caption">
      <div class="lb-sub" id="lbSub">—</div>
      <div class="lb-date" id="lbDate"></div>
    </div>
  </div>
  <button class="lb-arrow" id="lbPrev" aria-label="Photo précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="lb-arrow" id="lbNext" aria-label="Photo suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script src="crapaud.js"></script>
<script>
const ALBUMS = {
  lune: { emoji:'🌙', photos:['photos/lune/pleine-lune/04 Juin 2023.jpg','photos/lune/autre-phase/12 Juillet 2026.jpg'] },
  nature: { emoji:'🍃', photos:['photos/nature/soleil/25 Juillet 2026.jpg','photos/nature/fleurs/02 Juin 2024.jpg','photos/nature/animaux/01 Janvier 2024.jpg'] }
};
const STACK_TRANSFORM = i => 'translate('+i*3+'px, '+i*3+'px) rotate('+(i-1.5)*4+'deg)';
const BLOOM_TRANSFORM = ['translate(-115px, -85px) rotate(-9deg)','translate(115px, -85px) rotate(8deg)','translate(-115px, 85px) rotate(6deg)','translate(115px, 85px) rotate(-7deg)'];
function buildAlbum(containerId,category){
  const el=document.getElementById(containerId),album=ALBUMS[category];
  album.photos.forEach((src,i)=>{
    const card=document.createElement('div');card.className='polaroid';card.style.transform=STACK_TRANSFORM(i);card.style.zIndex=album.photos.length-1-i;
    card.innerHTML='<div class="photo-area"><img src="'+src+'" alt="" loading="lazy"></div>';el.appendChild(card);
  });
  const mark=document.createElement('span');mark.className='album-emoji';mark.setAttribute('aria-hidden','true');mark.textContent=album.emoji;el.appendChild(mark);
}
buildAlbum('albumLune','lune');
buildAlbum('albumNature','nature');

function bloomAlbum(albumEl, category){
  if (albumEl.classList.contains('bloomed')) return;
  albumEl.classList.add('bloomed');
  const cards = albumEl.querySelectorAll('.polaroid');
  cards.forEach((card, i) => {
    card.style.zIndex = 10 + i;
    card.style.transform = BLOOM_TRANSFORM[i];
  });
  setTimeout(() => openGallery(category), 950);
}

document.getElementById('albumLune').addEventListener('click', function(){ bloomAlbum(this, 'lune'); });
document.getElementById('albumNature').addEventListener('click', function(){ bloomAlbum(this, 'nature'); });
['albumLune','albumNature'].forEach(id=>document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();this.click();}}));

/* ---------- Galerie de stockage ---------- */
const GALLERY_TITLES = { lune: 'La Lune', nature: 'La Nature' };

const CATEGORY_META = {
  lune: {
    subLabels: ['Pleine lune', 'Autre phase'],
    tabEmojis: ['🌕', '🌗'],
    folderSlugs: ['pleine-lune', 'autre-phase'],
    defaultFilter: 1, // Autre phase
    showDate: true
  },
  nature: {
    subLabels: ['Soleil', 'Fleurs', 'Animaux'],
    tabEmojis: ['🌞', '🌹', '🐸'],
    folderSlugs: ['soleil', 'fleurs', 'animaux'],
    defaultFilter: 1, // Fleurs
    showDate: true
  }
};

const GITHUB_OWNER = 'Crapaud41';
const GITHUB_REPO = 'Site-Lune';
const IMG_EXT = /\.(jpe?g|png|webp|gif)$/i;
const FR_MONTHS = {
  janvier:0, février:1, fevrier:1, mars:2, avril:3, mai:4, juin:5,
  juillet:6, août:7, aout:7, septembre:8, octobre:9, novembre:10, décembre:11, decembre:11
};

function parseDateFromFilename(name){
  const base = name
    .replace(/\.[^.]+$/, '')   // enlève l'extension (.jpg)
    .replace(/\s*\(.*$/, '')   // enlève un suffixe " (1)" ou " (" ajouté par Windows
    .trim();
  let m = base.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = base.match(/^(\d{1,2})\s+([A-Za-zÀ-ÿ]+)\s+(\d{4})$/);
  if (m){
    const mon = FR_MONTHS[m[2].toLowerCase()];
    if (mon !== undefined) return new Date(+m[3], mon, +m[1]);
  }
  return null;
}

async function fetchFolder(category, subIndex, slug){
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/photos/${category}/${slug}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    if (!Array.isArray(data)) return [];
    return data
      .filter(f => f.type === 'file' && IMG_EXT.test(f.name))
      .map(f => {
        const d = parseDateFromFilename(f.name);
        return {
          url: f.download_url,
          name: f.name,
          sub: subIndex,
          date: d,
          dateLabel: d ? d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}) : null
        };
      });
  } catch(e){
    return [];
  }
}

const galleryCache = {};

async function fetchCategoryPhotos(category){
  if (galleryCache[category]) return galleryCache[category];
  const meta = CATEGORY_META[category];
  const results = await Promise.all(meta.folderSlugs.map((slug, i) => fetchFolder(category, i, slug)));
  const items = results.flat();
  items.sort((a, b) => {
    if (a.date && b.date) return b.date - a.date;
    if (a.date) return -1;
    if (b.date) return 1;
    return 0;
  });
  galleryCache[category] = items;
  return items;
}

let currentCategory = null;
let currentFilter = 0;
let currentItems = [];
let currentPage = 0;
const galleryPagination = document.getElementById('galleryPagination');

function buildFilterTabs(category){
  const meta = CATEGORY_META[category];
  const tabsEl = document.getElementById('filterTabs');
  let html = '';
  meta.subLabels.forEach((label, i) => {
    const activeClass = (i === meta.defaultFilter) ? ' active' : '';
    html += `<div class="filter-tab${activeClass}" data-filter="${i}"><span class="tab-emoji">${meta.tabEmojis[i]}</span> ${label}</div>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      tabsEl.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      currentPage = 0;
      renderGrid();
    });
  });
}

function renderGrid(){
  const meta = CATEGORY_META[currentCategory];
  const grid = document.getElementById('galleryGrid');
  const items = currentItems.filter(it => it.sub === Number(currentFilter));
  const pageSize = 22;
  const pageCount = Math.max(1, Math.ceil(items.length / pageSize));
  currentPage = Math.min(currentPage, pageCount - 1);
  visibleItems = items.slice(currentPage * pageSize, (currentPage + 1) * pageSize);
  const pagination = galleryPagination;
  grid.replaceChildren(pagination);
  pagination.hidden = false;
  document.getElementById('pageIndicator').textContent = `${currentPage + 1} / ${pageCount}`;
  document.getElementById('previousPage').disabled = currentPage === 0;
  document.getElementById('nextPage').disabled = currentPage >= pageCount - 1;
  if (items.length === 0){
    grid.innerHTML = `<div class="gallery-empty">Aucune photo pour l'instant dans cette catégorie.</div>`;
    grid.appendChild(pagination);
    return;
  }
  visibleItems.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'gallery-card';
    const img = document.createElement('img');
    img.src = item.url; img.loading = 'lazy';
    img.alt = descriptionFor(item) || meta.subLabels[item.sub];
    card.appendChild(img);
    card.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(card);
  });
}

async function openGallery(category){
  currentCategory = category;
  currentFilter = CATEGORY_META[category].defaultFilter;
  currentPage = 0;
  document.getElementById('galleryTitle').textContent = GALLERY_TITLES[category];
  buildFilterTabs(category);
  document.getElementById('albumView').classList.add('hidden');
  document.getElementById('galleryView').classList.add('visible');
  document.getElementById('galleryGrid').innerHTML = `<div class="gallery-loading">Chargement des photos…</div>`;
  currentItems = await fetchCategoryPhotos(category);
  await loadDescriptions();
  renderGrid();
}

function closeGallery(){
  document.getElementById('galleryView').classList.remove('visible');
  document.getElementById('albumView').classList.remove('hidden');
  ['albumLune','albumNature'].forEach(id => {
    const albumEl = document.getElementById(id);
    albumEl.classList.remove('bloomed');
    const cards = albumEl.querySelectorAll('.polaroid');
    const n = cards.length;
    cards.forEach((card, i) => { card.style.zIndex = n - 1 - i; card.style.transform = STACK_TRANSFORM(i); });
  });
}

document.getElementById('backBtn').addEventListener('click', closeGallery);
document.getElementById('previousPage').addEventListener('click',()=>{if(currentPage>0){currentPage--;renderGrid();}});
document.getElementById('nextPage').addEventListener('click',()=>{currentPage++;renderGrid();});

/* ---------- Descriptions (photos/descriptions.txt) ---------- */
// Une ligne par photo :  dossier/nom-du-fichier.jpg | Ta description
let descMap = null;
async function loadDescriptions(){
  if (descMap) return descMap;
  descMap = {};
  try {
    const res = await fetch('photos/descriptions.txt', {cache:'no-cache'});
    if (res.ok){
      (await res.text()).split(/\r?\n/).forEach(line => {
        line = line.trim();
        if (!line || line.startsWith('#')) return;
        const i = line.indexOf('|');
        if (i < 1) return;
        const key = line.slice(0, i).trim().normalize('NFC').toLowerCase();
        const val = line.slice(i + 1).trim();
        if (val) descMap[key] = val;
      });
    }
  } catch(e){}
  return descMap;
}
function descriptionFor(item){
  const slug = CATEGORY_META[currentCategory].folderSlugs[item.sub];
  return (descMap || {})[`${slug}/${item.name}`.normalize('NFC').toLowerCase()] || '';
}

/* ---------- Lightbox ---------- */
let visibleItems = [];
let lbIndex = -1;
let lightboxReturnFocus = null;

/* Zoom local à la photo : la page et ses commandes gardent leur taille. */
const photoZoom = (() => {
  const viewport = document.getElementById('imageViewport');
  const img = document.getElementById('lbImg');
  const minus = document.getElementById('zoomOut');
  const plus = document.getElementById('zoomIn');
  const resetButton = document.getElementById('zoomReset');
  const level = document.getElementById('zoomLevel');
  const pointers = new Map();
  const MAX_ZOOM = 5;
  let scale = 1, x = 0, y = 0, gesture = null;
  let lastTap = null, lastTouchInput = 0;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const ready = () => img.naturalWidth > 0 && !img.classList.contains('loading');

  function paint(){
    const width = viewport.clientWidth, height = viewport.clientHeight;
    x = clamp(x, -width * (scale - 1) / 2, width * (scale - 1) / 2);
    y = clamp(y, -height * (scale - 1) / 2, height * (scale - 1) / 2);
    img.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    viewport.classList.toggle('zoomed', scale > 1);
    level.textContent = `${Number(scale.toFixed(1)).toLocaleString('fr-FR')}×`;
    minus.disabled = resetButton.disabled = scale <= 1;
    plus.disabled = scale >= MAX_ZOOM;
  }

  function reset(){
    for (const id of pointers.keys()){
      if (viewport.hasPointerCapture(id)) viewport.releasePointerCapture(id);
    }
    pointers.clear(); gesture = null; lastTap = null;
    scale = 1; x = y = 0;
    viewport.classList.remove('dragging');
    paint();
  }

  function fit(){
    if (!img.naturalWidth || !img.naturalHeight) return;
    const maxWidth = Math.min(720, window.innerWidth * .9);
    const maxHeight = Math.max(80, Math.min(window.innerHeight * .7, window.innerHeight - 180));
    const ratio = Math.min(1, maxWidth / img.naturalWidth, maxHeight / img.naturalHeight);
    viewport.style.width = `${img.naturalWidth * ratio}px`;
    viewport.style.height = `${img.naturalHeight * ratio}px`;
    reset();
  }

  function localPoint(clientX, clientY){
    const rect = viewport.getBoundingClientRect();
    return {x:clientX - rect.left - rect.width / 2, y:clientY - rect.top - rect.height / 2};
  }

  function zoomTo(next, clientX, clientY){
    if (!ready()) return;
    const point = clientX === undefined ? {x:0,y:0} : localPoint(clientX,clientY);
    next = clamp(next, 1, MAX_ZOOM);
    const ratio = next / scale;
    x = point.x - (point.x - x) * ratio;
    y = point.y - (point.y - y) * ratio;
    scale = next;
    paint();
  }

  function toggle(clientX, clientY){
    zoomTo(scale > 1 ? 1 : 3, clientX, clientY);
  }

  function startGesture(){
    const points = [...pointers.values()];
    if (points.length === 2){
      const [a,b] = points;
      const middle = localPoint((a.x+b.x)/2, (a.y+b.y)/2);
      gesture = {type:'pinch',distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),scale,
        anchorX:(middle.x-x)/scale,anchorY:(middle.y-y)/scale};
      for (const point of points) point.moved = true;
      lastTap = null;
    } else if (points.length === 1){
      gesture = {type:'pan',startX:points[0].x,startY:points[0].y,x,y};
    } else gesture = null;
    viewport.classList.toggle('dragging', points.length > 0 && scale > 1);
  }

  viewport.addEventListener('wheel', e => {
    if (!ready()) return;
    e.preventDefault();
    const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? viewport.clientHeight : 1);
    zoomTo(scale * Math.exp(-delta * .002), e.clientX, e.clientY);
  }, {passive:false});
  viewport.addEventListener('dblclick', e => {
    e.preventDefault();
  });
  viewport.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (e.pointerType !== 'touch' && e.button === 2 && Date.now() - lastTouchInput > 650){
      zoomTo(scale / 1.5, e.clientX, e.clientY);
    }
  });
  viewport.addEventListener('pointerdown', e => {
    if (!ready() || pointers.size >= 2 || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    if (e.pointerType === 'touch') lastTouchInput = Date.now();
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,downX:e.clientX,downY:e.clientY,time:Date.now(),moved:false});
    viewport.setPointerCapture(e.pointerId);
    viewport.focus({preventScroll:true});
    startGesture();
  });
  viewport.addEventListener('pointermove', e => {
    const point = pointers.get(e.pointerId);
    if (!point) return;
    point.x = e.clientX; point.y = e.clientY;
    if (Math.hypot(point.x-point.downX,point.y-point.downY) > 6) point.moved = true;
    if (gesture?.type === 'pinch' && pointers.size === 2){
      const [a,b] = [...pointers.values()];
      const middle = localPoint((a.x+b.x)/2,(a.y+b.y)/2);
      scale = clamp(gesture.scale * Math.hypot(a.x-b.x,a.y-b.y) / gesture.distance,1,MAX_ZOOM);
      x = middle.x - gesture.anchorX * scale;
      y = middle.y - gesture.anchorY * scale;
      paint();
    } else if (gesture?.type === 'pan' && scale > 1){
      x = gesture.x + point.x - gesture.startX;
      y = gesture.y + point.y - gesture.startY;
      paint();
    }
    viewport.classList.toggle('dragging', scale > 1);
  });

  function endPointer(e){
    const point = pointers.get(e.pointerId);
    if (!point) return;
    if (e.type === 'pointerup' && e.pointerType === 'mouse' && e.button === 0 && !point.moved){
      zoomTo(scale * 1.5, e.clientX, e.clientY);
    }
    if (e.pointerType === 'touch'){
      lastTouchInput = Date.now();
      if (e.type === 'pointerup' && !point.moved && pointers.size === 1 && Date.now()-point.time < 300){
        if (lastTap && Date.now()-lastTap.time < 300 && Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y) < 30){
          toggle(e.clientX,e.clientY); lastTap = null;
        } else lastTap = {time:Date.now(),x:e.clientX,y:e.clientY};
      } else lastTap = null;
    }
    pointers.delete(e.pointerId);
    if (viewport.hasPointerCapture(e.pointerId)) viewport.releasePointerCapture(e.pointerId);
    startGesture();
  }
  viewport.addEventListener('pointerup',endPointer);
  viewport.addEventListener('pointercancel',endPointer);
  viewport.addEventListener('lostpointercapture',endPointer);
  minus.addEventListener('click',()=>zoomTo(scale/1.5));
  plus.addEventListener('click',()=>zoomTo(scale*1.5));
  resetButton.addEventListener('click',reset);
  window.addEventListener('resize',()=>{
    if (document.getElementById('lightbox').classList.contains('visible')) fit();
  });
  paint();
  return {reset,fit,change:factor=>zoomTo(scale*factor)};
})();

function openLightbox(i){
  lightboxReturnFocus = document.activeElement;
  lbIndex = i;
  showLightbox();
  document.getElementById('lightbox').classList.add('visible');
  document.getElementById('imageViewport').focus({preventScroll:true});
}
function showLightbox(){
  const item = visibleItems[lbIndex];
  if (!item) return;
  const meta = CATEGORY_META[currentCategory];
  const desc = descriptionFor(item);
  const date = (meta.showDate && item.dateLabel) ? item.dateLabel : '';
  const img = document.getElementById('lbImg');
  photoZoom.reset();
  img.classList.add('loading');
  img.onload = () => {img.classList.remove('loading'); photoZoom.fit();};
  img.onerror = () => {img.classList.remove('loading'); photoZoom.reset();};
  img.src = item.url;
  if (img.complete && img.naturalWidth){img.classList.remove('loading'); photoZoom.fit();}
  img.alt = desc || meta.subLabels[item.sub];
  const sub = document.getElementById('lbSub');
  sub.textContent = desc || meta.subLabels[item.sub];
  sub.style.display = '';
  document.getElementById('lbDate').textContent = date;
  document.querySelector('.lb-caption').style.display = (desc || date) ? '' : 'none';
  document.getElementById('lbPrev').hidden = lbIndex <= 0;
  document.getElementById('lbNext').hidden = lbIndex >= visibleItems.length - 1;
  [lbIndex - 1, lbIndex + 1].forEach(j => { if (visibleItems[j]) new Image().src = visibleItems[j].url; });  // précharge les voisines
}
function stepLightbox(d){
  const j = lbIndex + d;
  if (j < 0 || j >= visibleItems.length) return;
  lbIndex = j;
  showLightbox();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('visible');
  photoZoom.reset();
  if (lightboxReturnFocus?.isConnected) lightboxReturnFocus.focus({preventScroll:true});
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => stepLightbox(-1));
document.getElementById('lbNext').addEventListener('click', () => stepLightbox(1));
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('visible')) return;
  if (!e.ctrlKey && !e.metaKey && ['+','=','-','_','0'].includes(e.key)){
    e.preventDefault();
    if (e.key === '0') photoZoom.reset();
    else photoZoom.change(e.key === '-' || e.key === '_' ? 1/1.5 : 1.5);
    return;
  }
  if (e.key === 'Tab'){
    const controls = [...document.getElementById('lightbox').querySelectorAll('button:not([disabled]),[tabindex="0"]')].filter(el=>el.getClientRects().length);
    const first = controls[0], last = controls[controls.length-1];
    if (e.shiftKey && document.activeElement === first){e.preventDefault();last.focus();}
    else if (!e.shiftKey && document.activeElement === last){e.preventDefault();first.focus();}
    return;
  }
  if (e.key === 'ArrowRight') stepLightbox(1);
  else if (e.key === 'ArrowLeft') stepLightbox(-1);
  else if (e.key === 'Escape') closeLightbox();
});
</script>
