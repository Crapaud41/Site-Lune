<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune — Photos</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg-deep:#060814;--gold:#e8c17a;--gold-soft:#f0d9a8;--ink:#eef0f8;--ink-dim:#a9adc4;--line:rgba(232,193,122,0.18);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    color:var(--ink);font-family:'Work Sans',sans-serif;min-height:100vh;
    background:
      linear-gradient(180deg, rgba(6,8,20,0.88) 0%, rgba(6,8,20,0.75) 40%, rgba(6,8,20,0.94) 100%),
      url('bg-lake.jpg');
    background-size:cover; background-position:center; background-attachment:fixed;
    overflow-x:hidden;
  }
  nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 5vw;border-bottom:1px solid var(--line);background:rgba(6,8,20,0.35);backdrop-filter:blur(4px);position:relative;z-index:20;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:1.5rem;letter-spacing:0.06em;color:var(--gold-soft);font-weight:600;text-decoration:none;}
  .navlinks{list-style:none;display:flex;gap:2.6rem;}
  .navlinks a{color:var(--ink-dim);text-decoration:none;font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;font-weight:500;}
  .navlinks a.active{color:var(--gold-soft);}
  .navlinks a:hover{color:var(--ink);}

  main{min-height:calc(100vh - 73px); position:relative;}

  /* ---------- Vue sélection des albums ---------- */
  #albumView{
    min-height:calc(100vh - 73px);
    display:flex; align-items:center; justify-content:center;
    gap:min(14vw, 10rem);
    padding:3rem 5vw;
    transition:opacity 0.5s ease, visibility 0.5s;
  }
  #albumView.hidden{opacity:0; visibility:hidden; position:absolute; inset:0; pointer-events:none;}

  .album-wrap{display:flex; flex-direction:column; align-items:center; gap:1.4rem;}
  .album{
    position:relative; width:230px; height:290px; cursor:pointer;
  }
  .album-label{
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:1.55rem; color:var(--gold-soft); letter-spacing:0.02em;
  }
  .polaroid{
    position:absolute; top:0; left:0; width:230px; height:290px;
    background:#f3efe4; border-radius:4px;
    box-shadow:0 16px 38px rgba(0,0,0,0.45);
    padding:13px 13px 42px 13px; box-sizing:border-box;
    transition:transform 0.9s cubic-bezier(.2,1,.3,1), box-shadow 0.6s;
  }
  .polaroid .photo-area{
    width:100%; height:100%; background:#11142a; border-radius:1px;
    display:flex; align-items:center; justify-content:center;
    font-size:3.6rem; overflow:hidden;
  }
  .polaroid .photo-area svg{width:60%; height:60%;}
  .album:hover .polaroid{box-shadow:0 18px 40px rgba(0,0,0,0.55);}

  .album.bloomed{cursor:default;}

  @media (max-width:720px){
    nav{grid-template-columns:auto 1fr;padding:16px 5vw;}
    .navlinks{justify-self:end;gap:0.9rem;}
    .navlinks a{font-size:0.6rem;}
    .brand{font-size:1.2rem;}
  }
  @media (max-width:720px){
    #albumView{gap:4rem; flex-wrap:wrap;}
    .album{width:120px; height:154px;}
    .polaroid{width:120px; height:154px;}
  }

  /* ---------- Vue galerie (stockage) ---------- */
  #galleryView{
    display:none;
    padding:3.4rem 5vw 5rem;
  }
  #galleryView.visible{display:block;}
  .gallery-header{
    display:flex; align-items:center; gap:1.2rem; margin-bottom:2.4rem;
  }
  .back-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-family:'Work Sans',sans-serif; font-size:0.78rem; letter-spacing:0.08em;
    text-transform:uppercase; padding:0.55rem 1.1rem; cursor:pointer;
    transition:color 0.2s, border-color 0.2s;
  }
  .back-btn:hover{color:var(--gold-soft); border-color:var(--gold);}
  .gallery-title{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    font-size:1.6rem; color:var(--gold-soft);
  }
  /* --- Onglets filtres --- */
  .filter-tabs{
    display:flex; gap:0.7rem; margin-bottom:2rem; flex-wrap:wrap;
  }
  .filter-tab{
    display:flex; align-items:center; gap:0.5rem;
    border:1px solid var(--line); background:rgba(255,255,255,0.02);
    color:var(--ink-dim); font-family:'Work Sans',sans-serif;
    font-size:0.76rem; letter-spacing:0.05em;
    padding:0.5rem 1rem; cursor:pointer; transition:border-color 0.2s, color 0.2s, background 0.2s;
  }
  .filter-tab .tab-emoji{font-size:0.95rem;}
  .filter-tab:hover{color:var(--ink); border-color:var(--gold);}
  .filter-tab.active{color:var(--gold-soft); border-color:var(--gold); background:rgba(232,193,122,0.08);}

  .gallery-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:1.4rem;
  }
  .gallery-card{
    position:relative; aspect-ratio:1; border:1px solid var(--line);
    background:rgba(255,255,255,0.03); overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5rem;
    color:var(--ink-dim); font-size:0.7rem; letter-spacing:0.04em;
    cursor:pointer; transition:transform 0.35s ease, border-color 0.3s;
  }
  .gallery-card:hover{transform:scale(1.035); border-color:var(--gold);}
  .gallery-card .ph-icon{font-size:1.6rem; opacity:0.5; transition:opacity 0.3s;}
  .card-overlay{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:0.9rem;
    background:linear-gradient(180deg, transparent 40%, rgba(6,8,20,0.88) 100%);
    opacity:0; transition:opacity 0.3s ease;
    text-align:center;
  }
  .gallery-card:hover .card-overlay{opacity:1;}
  .card-overlay .ov-sub{color:var(--gold-soft); font-size:0.72rem; font-style:italic; font-family:'Cormorant Garamond',serif;}
  .card-overlay .ov-date{color:var(--ink-dim); font-size:0.62rem; margin-top:0.2rem;}

  /* --- Lightbox --- */
  #lightbox{
    display:none; position:fixed; inset:0; z-index:50;
    background:rgba(3,4,10,0.92); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:5vw;
  }
  #lightbox.visible{display:flex;}
  .lightbox-content{
    background:#0d1024; border:1px solid var(--line);
    width:min(480px, 90vw); aspect-ratio:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.8rem;
    position:relative;
  }
  .lightbox-content .lb-icon{font-size:3rem; opacity:0.5;}
  .lightbox-content .lb-sub{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.3rem; color:var(--gold-soft);}
  .lightbox-content .lb-date{font-size:0.78rem; color:var(--ink-dim);}
  .lightbox-close{
    position:absolute; top:-2.6rem; right:0; background:none; border:none;
    color:var(--ink-dim); font-size:0.85rem; letter-spacing:0.08em; text-transform:uppercase;
    cursor:pointer; padding:0.4rem;
  }
  .lightbox-close:hover{color:var(--gold-soft);}

  @media (max-width:720px){
    .gallery-grid{grid-template-columns:repeat(2, 1fr); gap:1rem;}
    .filter-tabs{gap:0.5rem;}
    .filter-tab{font-size:0.68rem; padding:0.4rem 0.75rem;}
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">Lune</a>
  <ul class="navlinks">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="photos.html" class="active">Photos</a></li>
    <li><a href="materiel.html">Matériel</a></li>
    <li><a href="widget.html">Widget</a></li>
  </ul>
</nav>

<main>

  <div id="albumView">
    <div class="album-wrap">
      <div class="album" id="albumLune" data-category="lune">
        <!-- polaroids générés en JS -->
      </div>
      <div class="album-label">Lune</div>
    </div>

    <div class="album-wrap">
      <div class="album" id="albumNature" data-category="nature">
        <!-- polaroids générés en JS -->
      </div>
      <div class="album-label">Nature</div>
    </div>
  </div>

  <div id="galleryView">
    <div class="gallery-header">
      <button class="back-btn" id="backBtn">← Retour</button>
      <div class="gallery-title" id="galleryTitle">—</div>
    </div>
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

</main>

<div id="lightbox">
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightboxClose">✕ Fermer</button>
    <div class="lb-icon">🖼️</div>
    <div class="lb-sub" id="lbSub">—</div>
    <div class="lb-date" id="lbDate"></div>
  </div>
</div>

<script>
const BLUE_ROSE_SVG = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <path d="M32 40 C30 46 34 52 30 58" stroke="#3a8a4a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M30 50 C24 49 21 53 22 58 C27 58 30 55 30 50 Z" fill="#3a8a4a"/>
  <path d="M32 12 C41 12 48 18 46 25 C53 25 54 34 46 37 C51 42 45 48 38 45 C40 52 30 53 27 46 C21 49 16 43 21 38 C14 37 15 28 22 27 C19 20 25 12 32 12 Z" fill="#233f9c"/>
  <path d="M32 17 C37 17 41 20 39 25 C44 24 45 30 40 32 C43 35 39 39 35 37 C36 41 30 41 29 37 C25 39 22 34 26 31 C21 30 22 24 27 24 C25 20 28 17 32 17 Z" fill="#3557c4"/>
  <path d="M31 21 C34 21 36 23 34 26 C37 26 37 30 34 31 C36 33 33 35 31 33 C31 36 27 35 28 32 C25 33 24 29 27 28 C24 27 26 23 29 24 C28 22 30 21 31 21 Z" fill="#5c7cdc"/>
  <circle cx="30" cy="27" r="2.6" fill="#8aa2ec"/>
</svg>`;

const ALBUMS = {
  lune: { emojis: ['🌙','🌕','🌘','🌑'] },
  nature: { emojis: ['🍃','🌞', BLUE_ROSE_SVG, '🐸'] }
};

/* Positions de la pile (repliée) et de l'éventail (floraison) */
const STACK_TRANSFORM = i => `translate(${i*3}px, ${i*3}px) rotate(${(i-1.5)*4}deg)`;
const BLOOM_TRANSFORM = [
  'translate(-115px, -85px) rotate(-9deg)',
  'translate(115px, -85px) rotate(8deg)',
  'translate(-115px, 85px) rotate(6deg)',
  'translate(115px, 85px) rotate(-7deg)'
];

function buildAlbum(containerId, category){
  const el = document.getElementById(containerId);
  const emojis = ALBUMS[category].emojis;
  emojis.forEach((content, i) => {
    const card = document.createElement('div');
    card.className = 'polaroid';
    card.style.transform = STACK_TRANSFORM(i);
    card.style.zIndex = emojis.length - 1 - i;
    const isMarkup = content.trim().startsWith('<');
    card.innerHTML = `<div class="photo-area">${isMarkup ? content : `<span>${content}</span>`}</div>`;
    el.appendChild(card);
  });
}

buildAlbum('albumLune', 'lune');
buildAlbum('albumNature', 'nature');

function bloomAlbum(albumEl, category){
  if (albumEl.classList.contains('bloomed')) return;
  albumEl.classList.add('bloomed');
  const cards = albumEl.querySelectorAll('.polaroid');
  cards.forEach((card, i) => {
    card.style.zIndex = 10 + i;
    card.style.transform = BLOOM_TRANSFORM[i];
  });
  setTimeout(() => openGallery(category), 950);
}

document.getElementById('albumLune').addEventListener('click', function(){ bloomAlbum(this, 'lune'); });
document.getElementById('albumNature').addEventListener('click', function(){ bloomAlbum(this, 'nature'); });

/* ---------- Galerie de stockage ---------- */
const GALLERY_TITLES = { lune: 'Album Lune', nature: 'Album Nature' };

const CATEGORY_META = {
  lune: {
    subLabels: ['Nouvelle lune', 'Pleine lune', 'Lune décroissante', 'Autre phase'],
    tabEmojis: ['🌙', '🌕', '🌘', '🌑'],
    showDate: true
  },
  nature: {
    subLabels: ['Feuillage', 'Coucher de soleil', 'Fleurs', 'Faune'],
    tabEmojis: ['🍃', '🌞', '🌹', '🐸'],
    showDate: true
  }
};

let currentCategory = null;
let currentFilter = 'all';

function buildPlaceholderData(category){
  // 12 emplacements en attente de vraies photos, répartis sur les 4 sous-catégories
  const items = [];
  for (let i = 0; i < 12; i++){
    items.push({ sub: i % 4, date: null });
  }
  return items;
}

function buildFilterTabs(category){
  const meta = CATEGORY_META[category];
  const tabsEl = document.getElementById('filterTabs');
  let html = `<div class="filter-tab active" data-filter="all"><span class="tab-emoji">✦</span> Tout</div>`;
  meta.subLabels.forEach((label, i) => {
    html += `<div class="filter-tab" data-filter="${i}"><span class="tab-emoji">${meta.tabEmojis[i]}</span> ${label}</div>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      tabsEl.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderGrid();
    });
  });
}

function renderGrid(){
  const meta = CATEGORY_META[currentCategory];
  const grid = document.getElementById('galleryGrid');
  const items = buildPlaceholderData(currentCategory).filter(it =>
    currentFilter === 'all' || it.sub === Number(currentFilter)
  );
  grid.innerHTML = '';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'gallery-card';
    const subLabel = meta.subLabels[item.sub];
    const dateHtml = (meta.showDate && item.date) ? `<div class="ov-date">${item.date}</div>` : '';
    card.innerHTML = `
      <div class="ph-icon">🖼️</div><div>Photo à venir</div>
      <div class="card-overlay">
        <div class="ov-sub">${meta.tabEmojis[item.sub]} ${subLabel}</div>
        ${dateHtml}
      </div>`;
    card.addEventListener('click', () => openLightbox(subLabel, meta.showDate ? item.date : null));
    grid.appendChild(card);
  });
}

function openGallery(category){
  currentCategory = category;
  currentFilter = 'all';
  document.getElementById('galleryTitle').textContent = GALLERY_TITLES[category];
  buildFilterTabs(category);
  renderGrid();
  document.getElementById('albumView').classList.add('hidden');
  document.getElementById('galleryView').classList.add('visible');
}

function closeGallery(){
  document.getElementById('galleryView').classList.remove('visible');
  document.getElementById('albumView').classList.remove('hidden');
  ['albumLune','albumNature'].forEach(id => {
    const albumEl = document.getElementById(id);
    albumEl.classList.remove('bloomed');
    const cards = albumEl.querySelectorAll('.polaroid');
    const n = cards.length;
    cards.forEach((card, i) => { card.style.zIndex = n - 1 - i; card.style.transform = STACK_TRANSFORM(i); });
  });
}

document.getElementById('backBtn').addEventListener('click', closeGallery);

/* ---------- Lightbox ---------- */
function openLightbox(subLabel, date){
  document.getElementById('lbSub').textContent = subLabel;
  document.getElementById('lbDate').textContent = date || '';
  document.getElementById('lightbox').classList.add('visible');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('visible');
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});
</script>

</body>
</html>
