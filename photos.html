<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune — Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg-deep:#060814;--gold:#e8c17a;--gold-soft:#f0d9a8;--ink:#eef0f8;--ink-dim:#a9adc4;--line:rgba(232,193,122,0.18);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    color:var(--ink);font-family:'Work Sans',sans-serif;min-height:100vh;
    background:
      linear-gradient(180deg, rgba(6,8,20,0.88) 0%, rgba(6,8,20,0.75) 40%, rgba(6,8,20,0.94) 100%),
      url('bg-lake.jpg');
    background-size:cover; background-position:center; background-attachment:fixed;
    overflow-x:hidden;
  }
  nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 5vw;border-bottom:1px solid var(--line);background:rgba(6,8,20,0.35);backdrop-filter:blur(4px);position:relative;z-index:20;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:1.5rem;letter-spacing:0.06em;color:var(--gold-soft);font-weight:600;text-decoration:none;}
  .navlinks{list-style:none;display:flex;gap:2.6rem;}
  .navlinks a{color:var(--ink-dim);text-decoration:none;font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;font-weight:500;}
  .navlinks a.active{color:var(--gold-soft);}
  .navlinks a:hover{color:var(--ink);}

  main{min-height:calc(100vh - 73px); position:relative;}

  /* ---------- Vue sélection des albums ---------- */
  #albumView{
    min-height:calc(100vh - 73px);
    display:flex; align-items:center; justify-content:center;
    gap:min(14vw, 10rem);
    padding:3rem 5vw;
    transition:opacity 0.5s ease, visibility 0.5s;
  }
  #albumView.hidden{opacity:0; visibility:hidden; position:absolute; inset:0; pointer-events:none;}

  .album-wrap{display:flex; flex-direction:column; align-items:center; gap:1.4rem;}
  .album{
    position:relative; width:230px; height:290px; cursor:pointer;
  }
  .album-label{
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:1.55rem; color:var(--gold-soft); letter-spacing:0.02em;
  }
  .polaroid{
    position:absolute; top:0; left:0; width:230px; height:290px;
    background:#f3efe4; border-radius:4px;
    box-shadow:0 16px 38px rgba(0,0,0,0.45);
    padding:13px 13px 42px 13px; box-sizing:border-box;
    transition:transform 0.9s cubic-bezier(.2,1,.3,1), box-shadow 0.6s;
  }
  .polaroid .photo-area{
    width:100%; height:100%; background:#11142a; border-radius:1px;
    display:flex; align-items:center; justify-content:center;
    font-size:3.6rem; overflow:hidden;
  }
  .polaroid .photo-area svg{width:60%; height:60%;}
  .album:hover .polaroid{box-shadow:0 18px 40px rgba(0,0,0,0.55);}

  .album.bloomed{cursor:default;}

  @media (max-width:720px){
    nav{grid-template-columns:auto 1fr;padding:16px 5vw;}
    .navlinks{justify-self:end;gap:0.9rem;}
    .navlinks a{font-size:0.6rem;}
    .brand{font-size:1.2rem;}
  }
  @media (max-width:720px){
    #albumView{gap:4rem; flex-wrap:wrap;}
    .album{width:120px; height:154px;}
    .polaroid{width:120px; height:154px;}
  }

  /* ---------- Vue galerie (stockage) ---------- */
  #galleryView{
    display:none;
    padding:3.4rem 5vw 5rem;
  }
  #galleryView.visible{display:block;}
  .gallery-header{
    display:flex; align-items:center; gap:1.2rem; margin-bottom:2.4rem;
  }
  .back-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-family:'Work Sans',sans-serif; font-size:0.78rem; letter-spacing:0.08em;
    text-transform:uppercase; padding:0.55rem 1.1rem; cursor:pointer;
    transition:color 0.2s, border-color 0.2s;
  }
  .back-btn:hover{color:var(--gold-soft); border-color:var(--gold);}
  .gallery-title{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    font-size:1.6rem; color:var(--gold-soft);
  }
  .gallery-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:1.4rem;
  }
  .gallery-card{
    aspect-ratio:1; border:1px solid var(--line);
    background:rgba(255,255,255,0.03);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5rem;
    color:var(--ink-dim); font-size:0.7rem; letter-spacing:0.04em;
  }
  .gallery-card .ph-icon{font-size:1.6rem; opacity:0.5;}

  @media (max-width:720px){
    .gallery-grid{grid-template-columns:repeat(2, 1fr); gap:1rem;}
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">Lune</a>
  <ul class="navlinks">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="photos.html" class="active">Photos</a></li>
    <li><a href="materiel.html">Matériel</a></li>
    <li><a href="widget.html">Widget</a></li>
  </ul>
</nav>

<main>

  <div id="albumView">
    <div class="album-wrap">
      <div class="album" id="albumLune" data-category="lune">
        <!-- polaroids générés en JS -->
      </div>
      <div class="album-label">Lune</div>
    </div>

    <div class="album-wrap">
      <div class="album" id="albumNature" data-category="nature">
        <!-- polaroids générés en JS -->
      </div>
      <div class="album-label">Nature</div>
    </div>
  </div>

  <div id="galleryView">
    <div class="gallery-header">
      <button class="back-btn" id="backBtn">← Retour</button>
      <div class="gallery-title" id="galleryTitle">—</div>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

</main>

<script>
const ROSE_IMG = `<img src="rose-emoji.png" alt="Rose bleue" style="width:100%;height:100%;object-fit:contain;">`;

const ALBUMS = {
  lune: { emojis: ['🌙','🌕','🌘','🌑'] },
  nature: { emojis: ['🍃','🌞', ROSE_IMG, '🐸'] }
};

/* Positions de la pile (repliée) et de l'éventail (floraison) */
const STACK_TRANSFORM = i => `translate(${i*3}px, ${i*3}px) rotate(${(i-1.5)*4}deg)`;
const BLOOM_TRANSFORM = [
  'translate(-115px, -85px) rotate(-9deg)',
  'translate(115px, -85px) rotate(8deg)',
  'translate(-115px, 85px) rotate(6deg)',
  'translate(115px, 85px) rotate(-7deg)'
];

function buildAlbum(containerId, category){
  const el = document.getElementById(containerId);
  const emojis = ALBUMS[category].emojis;
  emojis.forEach((content, i) => {
    const card = document.createElement('div');
    card.className = 'polaroid';
    card.style.transform = STACK_TRANSFORM(i);
    card.style.zIndex = emojis.length - 1 - i;
    const isMarkup = content.trim().startsWith('<');
    card.innerHTML = `<div class="photo-area">${isMarkup ? content : `<span>${content}</span>`}</div>`;
    el.appendChild(card);
  });
}

buildAlbum('albumLune', 'lune');
buildAlbum('albumNature', 'nature');

function bloomAlbum(albumEl, category){
  if (albumEl.classList.contains('bloomed')) return;
  albumEl.classList.add('bloomed');
  const cards = albumEl.querySelectorAll('.polaroid');
  cards.forEach((card, i) => {
    card.style.zIndex = 10 + i;
    card.style.transform = BLOOM_TRANSFORM[i];
  });
  setTimeout(() => openGallery(category), 950);
}

document.getElementById('albumLune').addEventListener('click', function(){ bloomAlbum(this, 'lune'); });
document.getElementById('albumNature').addEventListener('click', function(){ bloomAlbum(this, 'nature'); });

/* ---------- Galerie de stockage ---------- */
const GALLERY_TITLES = { lune: 'Album Lune', nature: 'Album Nature' };

function buildPlaceholderGrid(category){
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 8; i++){
    const card = document.createElement('div');
    card.className = 'gallery-card';
    card.innerHTML = `<div class="ph-icon">🖼️</div><div>Photo à venir</div>`;
    grid.appendChild(card);
  }
}

function openGallery(category){
  document.getElementById('galleryTitle').textContent = GALLERY_TITLES[category];
  buildPlaceholderGrid(category);
  document.getElementById('albumView').classList.add('hidden');
  document.getElementById('galleryView').classList.add('visible');
}

function closeGallery(){
  document.getElementById('galleryView').classList.remove('visible');
  document.getElementById('albumView').classList.remove('hidden');
  ['albumLune','albumNature'].forEach(id => {
    const albumEl = document.getElementById(id);
    albumEl.classList.remove('bloomed');
    const cards = albumEl.querySelectorAll('.polaroid');
    const n = cards.length;
    cards.forEach((card, i) => { card.style.zIndex = n - 1 - i; card.style.transform = STACK_TRANSFORM(i); });
  });
}

document.getElementById('backBtn').addEventListener('click', closeGallery);
</script>

</body>
</html>
