<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune — Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#060814;
    --gold:#e8c17a;
    --gold-soft:#f0d9a8;
    --ink:#eef0f8;
    --ink-dim:#a9adc4;
    --line:rgba(232,193,122,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    color:var(--ink);
    font-family:'Work Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    background:
      linear-gradient(180deg, rgba(6,8,20,0.88) 0%, rgba(6,8,20,0.8) 40%, rgba(6,8,20,0.94) 100%),
      url('bg-reeds.jpg');
    background-size:cover; background-position:center; background-attachment:fixed;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  nav{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:22px 5vw; border-bottom:1px solid var(--line);
    background:rgba(6,8,20,0.35); backdrop-filter:blur(4px);
    position:relative; z-index:2;
  }
  .brand{
    font-family:'Cormorant Garamond', serif; font-size:1.5rem;
    letter-spacing:0.06em; color:var(--gold-soft); font-weight:600;
    text-decoration:none;
  }
  .navlinks{list-style:none; display:flex; gap:2.6rem;}
  .navlinks a{
    color:var(--ink-dim); text-decoration:none; font-size:0.82rem;
    letter-spacing:0.14em; text-transform:uppercase; font-weight:500;
  }
  .navlinks a.active{color:var(--gold-soft);}
  .navlinks a:hover{color:var(--ink);}

  main{padding:4rem 5vw 6rem; max-width:1100px; margin:0 auto;}
  .page-title{
    font-family:'Cormorant Garamond', serif; font-weight:600;
    font-size:clamp(2rem, 4vw, 2.8rem); margin-bottom:0.6rem;
  }
  .page-sub{color:var(--ink-dim); margin-bottom:3rem; font-weight:300;}

  h2{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    font-size:1.4rem; color:var(--gold-soft); margin-bottom:1.2rem;
  }
  section{margin-bottom:4rem;}

  /* --- Comptes à rebours --- */
  .countdown-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:1.4rem;
  }
  .countdown-card{
    border:1px solid var(--line); padding:1.8rem 1.6rem;
    background:linear-gradient(180deg, rgba(232,193,122,0.035), transparent 60%);
  }
  .countdown-label{
    font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:0.8rem;
  }
  .countdown-timer{
    font-family:'Cormorant Garamond', serif; font-size:2rem; color:var(--gold-soft);
    font-weight:600; margin-bottom:0.5rem;
  }
  .countdown-timer span{font-size:1rem; color:var(--ink-dim); font-family:'Work Sans',sans-serif; font-weight:300;}
  .countdown-date{font-size:0.78rem; color:var(--ink-dim);}

  /* --- Calendrier --- */
  .cal-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:1.2rem;
  }
  .cal-month{font-family:'Cormorant Garamond', serif; font-style:italic; font-size:1.4rem; color:var(--gold-soft);}
  .cal-grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:0.4rem;
  }
  .cal-dow{
    text-align:center; font-size:0.62rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--ink-dim); padding-bottom:0.5rem;
  }
  .cal-day{
    aspect-ratio:1; border:1px solid var(--line); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:0.3rem; position:relative;
  }
  .cal-day.empty{border-color:transparent;}
  .cal-day.today{border-color:var(--gold);}
  .cal-daynum{font-size:0.66rem; color:var(--ink-dim); position:absolute; top:4px; left:6px;}
  .cal-day svg{width:60%; height:60%; margin-top:6px;}

  /* --- Événements --- */
  .events-list{display:flex; flex-direction:column; gap:1rem;}
  .event-card{
    border:1px solid var(--line); padding:1.4rem 1.6rem;
    display:flex; justify-content:space-between; align-items:center; gap:1rem;
    flex-wrap:wrap;
  }
  .event-name{font-family:'Cormorant Garamond', serif; font-style:italic; font-size:1.15rem; color:var(--ink);}
  .event-date{font-size:0.8rem; color:var(--gold-soft); margin-top:0.3rem;}
  .event-meta{font-size:0.72rem; color:var(--ink-dim); text-align:right;}

  @media (max-width: 720px){
    .countdown-grid{grid-template-columns:1fr;}
    nav{grid-template-columns:auto 1fr; padding:16px 5vw;}
    .navlinks{justify-self:end; gap:1rem;}
    .navlinks a{font-size:0.62rem;}
    .brand{font-size:1.2rem;}
    .cal-day svg{width:50%; height:50%;}
    .event-card{flex-direction:column; align-items:flex-start;}
    .event-meta{text-align:left;}
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">Lune</a>
  <ul class="navlinks">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="photos.html">Photos</a></li>
    <li><a href="materiel.html">Matériel</a></li>
    <li><a href="widget.html" class="active">Widget</a></li>
  </ul>
</nav>

<main>
  <div class="page-title">Le ciel, à l'avance</div>
  <p class="page-sub">Calendrier des phases, comptes à rebours et prochains événements à observer.</p>

  <section>
    <h2>Prochaines phases clés</h2>
    <div class="countdown-grid">
      <div class="countdown-card">
        <div class="countdown-label">Prochaine pleine lune</div>
        <div class="countdown-timer" id="cdFull">—</div>
        <div class="countdown-date" id="cdFullDate"></div>
      </div>
      <div class="countdown-card">
        <div class="countdown-label">Prochaine nouvelle lune</div>
        <div class="countdown-timer" id="cdNew">—</div>
        <div class="countdown-date" id="cdNewDate"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="cal-header">
      <div class="cal-month" id="calMonth">—</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <section>
    <h2>Événements à venir</h2>
    <div class="events-list" id="eventsList">
      <div class="event-card"><div class="event-name">Calcul en cours…</div></div>
    </div>
  </section>
</main>

<script src="astronomy.min.js"></script>
<script>
const KM_PER_AU = 149597870.7;
const ORLEANS = new Astronomy.Observer(47.9, 1.9, 100);

/* ---------- Icône lune miniature (même formule que l'accueil) ---------- */
function moonIconSVG(phaseFraction, size){
  const r = 40, cx = 50, cy = 50;
  const theta = phaseFraction * 2 * Math.PI;
  const rx = Math.abs(r * Math.cos(theta));
  const sweepOuter = phaseFraction < 0.5 ? 1 : 0;
  const sweepInner = (phaseFraction < 0.25 || phaseFraction > 0.75) ? (1 - sweepOuter) : sweepOuter;
  const d = `M ${cx} ${cy-r} A ${r} ${r} 0 0 ${sweepOuter} ${cx} ${cy+r} A ${rx} ${r} 0 0 ${sweepInner} ${cx} ${cy-r} Z`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="clip-${Math.random().toString(36).slice(2)}"><circle cx="50" cy="50" r="${r}"/></clipPath></defs>
    <circle cx="50" cy="50" r="${r}" fill="#1b1f38" stroke="rgba(232,193,122,0.3)" stroke-width="1"/>
    <clipPath id="cc"><circle cx="50" cy="50" r="${r}"/></clipPath>
    <path d="${d}" fill="#e8c17a" clip-path="url(#cc)"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(232,193,122,0.35)" stroke-width="1"/>
  </svg>`;
}

/* ---------- Comptes à rebours ---------- */
let nextFullDate, nextNewDate;

function initCountdownTargets(){
  const now = new Date();
  nextFullDate = Astronomy.SearchMoonPhase(180, now, 40).date;
  nextNewDate = Astronomy.SearchMoonPhase(0, now, 40).date;

  const fmt = d => d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
  document.getElementById('cdFullDate').textContent = fmt(nextFullDate);
  document.getElementById('cdNewDate').textContent = fmt(nextNewDate);
}

function formatCountdown(target){
  const diff = target.getTime() - Date.now();
  if (diff <= 0) return 'Maintenant';
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  return `${days}<span> j</span> ${hours}<span> h</span> ${mins}<span> min</span>`;
}

function tickCountdowns(){
  document.getElementById('cdFull').innerHTML = formatCountdown(nextFullDate);
  document.getElementById('cdNew').innerHTML = formatCountdown(nextNewDate);
}

/* ---------- Calendrier du mois ---------- */
function buildCalendar(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('calMonth').textContent = `${monthNames[month]} ${year}`;

  const dows = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const grid = document.getElementById('calGrid');
  grid.innerHTML = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayNum = now.getDate();

  for (let i = 0; i < startOffset; i++){
    grid.insertAdjacentHTML('beforeend', `<div class="cal-day empty"></div>`);
  }
  for (let day = 1; day <= daysInMonth; day++){
    const d = new Date(year, month, day, 12, 0, 0);
    const angle = Astronomy.MoonPhase(d);
    const phaseFraction = angle / 360;
    const isToday = day === todayNum;
    grid.insertAdjacentHTML('beforeend',
      `<div class="cal-day${isToday ? ' today' : ''}">
         <span class="cal-daynum">${day}</span>
         ${moonIconSVG(phaseFraction)}
       </div>`);
  }
}

/* ---------- Événements : superlune + éclipse ---------- */
function findNextSupermoon(){
  const THRESHOLD_KM = 361000;
  let t = new Date();
  for (let i = 0; i < 14; i++){
    const full = Astronomy.SearchMoonPhase(180, t, 35);
    const illum = Astronomy.Illumination(Astronomy.Body.Moon, full.date);
    const distKm = illum.geo_dist * KM_PER_AU;
    if (distKm < THRESHOLD_KM){
      return { date: full.date, distKm };
    }
    t = full.AddDays(2);
  }
  return null;
}

function findNextEclipse(){
  const now = new Date();
  const ecl = Astronomy.SearchLunarEclipse(now);
  const eq = Astronomy.Equator(Astronomy.Body.Moon, ecl.peak.date, ORLEANS, true, true);
  const hor = Astronomy.Horizon(ecl.peak.date, ORLEANS, eq.ra, eq.dec, 'normal');
  const visible = hor.altitude > 0;
  return { date: ecl.peak.date, kind: ecl.kind, visible, altitude: hor.altitude };
}

function buildEvents(){
  const list = document.getElementById('eventsList');
  const items = [];

  const superm = findNextSupermoon();
  if (superm){
    items.push(`
      <div class="event-card">
        <div>
          <div class="event-name">Prochaine superlune</div>
          <div class="event-date">${superm.date.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'})}</div>
        </div>
        <div class="event-meta">${Math.round(superm.distKm).toLocaleString('fr-FR')} km<br>Pleine lune au plus proche de la Terre</div>
      </div>`);
  }

  const eclipse = findNextEclipse();
  const kindNames = { total: 'Éclipse lunaire totale', partial: 'Éclipse lunaire partielle', penumbral: 'Éclipse lunaire pénombrale' };
  items.push(`
    <div class="event-card">
      <div>
        <div class="event-name">${kindNames[eclipse.kind] || 'Éclipse lunaire'}</div>
        <div class="event-date">${eclipse.date.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
      </div>
      <div class="event-meta">${eclipse.visible ? 'Visible depuis la France' : 'Non visible depuis la France'}<br>(lune à ${eclipse.altitude.toFixed(0)}° d'altitude au pic, vue d'Orléans)</div>
    </div>`);

  list.innerHTML = items.join('');
}

initCountdownTargets();
tickCountdowns();
setInterval(tickCountdowns, 1000);
buildCalendar();
buildEvents();
</script>

</body>
</html>
