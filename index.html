<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune — Accueil</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1026;
    --bg-deep:#060814;
    --gold:#e8c17a;
    --gold-soft:#f0d9a8;
    --ink:#eef0f8;
    --ink-dim:#a9adc4;
    --line:rgba(232,193,122,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg-deep);
    color:var(--ink);
    font-family:'Work Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* --- NAV --- */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:22px 5vw;
    background:linear-gradient(to bottom, rgba(6,8,20,0.75), transparent);
    backdrop-filter:blur(2px);
  }
  .brand{
    font-family:'Cormorant Garamond', serif;
    font-size:1.5rem; letter-spacing:0.06em; color:var(--gold-soft);
    font-weight:600;
  }
  .navlinks{list-style:none; display:flex; gap:2.6rem;}
  .navlinks a{
    color:var(--ink-dim); text-decoration:none; font-size:0.82rem;
    letter-spacing:0.14em; text-transform:uppercase; font-weight:500;
    position:relative; padding-bottom:4px; transition:color 0.25s;
  }
  .navlinks a::after{
    content:''; position:absolute; left:0; bottom:0; width:0; height:1px;
    background:var(--gold); transition:width 0.3s ease;
  }
  .navlinks a:hover{color:var(--ink);}
  .navlinks a:hover::after{width:100%;}
  .navlinks a:focus-visible{outline:1px solid var(--gold); outline-offset:4px;}

  /* --- HERO --- */
  .hero{
    position:relative; height:100vh; width:100%;
    display:flex; align-items:flex-end; justify-content:flex-start;
    overflow:hidden;
  }
  .hero-img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; filter:saturate(0.92) brightness(0.62);
  }
  .hero-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,8,20,0.15) 0%, rgba(6,8,20,0.15) 35%, rgba(6,8,20,0.92) 100%),
               linear-gradient(90deg, rgba(6,8,20,0.55) 0%, rgba(6,8,20,0) 45%);
  }
  .hero-bottom{
    position:relative; z-index:2; width:100%;
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:2.5rem; flex-wrap:wrap;
    padding:0 5vw 3.2vw;
  }
  .hero-content{
    max-width:560px;
  }
  .eyebrow{
    color:var(--gold); font-size:0.78rem; letter-spacing:0.22em;
    text-transform:uppercase; margin-bottom:1rem; opacity:0.9;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(2.2rem, 4.6vw, 3.6rem);
    line-height:1.05;
    color:var(--ink);
    margin-bottom:1.1rem;
  }
  h1 em{color:var(--gold-soft); font-style:italic;}
  .hero-sub{
    color:var(--ink-dim); font-size:0.98rem; max-width:440px; line-height:1.6;
    font-weight:300;
  }

  /* --- Widget lunaire repris de Lune-Site --- */
  .moon-card{position:absolute;z-index:3;right:6.3vw;bottom:7vh;width:min(380px,38vw);padding:1.5rem;border:1px solid var(--line);background:rgba(9,11,18,0.82);box-shadow:0 16px 50px rgba(0,0,0,0.22);backdrop-filter:blur(10px);}
  .moon-card-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.3rem;color:var(--ink-dim);font-size:0.58rem;font-weight:700;letter-spacing:0.16em;}
  .live-dot{color:var(--gold-soft);white-space:nowrap;}
  .live-dot::before{display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--gold);content:"";vertical-align:1px;}
  .moon-summary{display:flex;align-items:center;gap:1rem;padding-bottom:1.2rem;}
  .moon-visual{position:relative;display:grid;width:72px;height:72px;flex:0 0 72px;place-items:center;overflow:hidden;border-radius:50%;background:#eee8d7;box-shadow:0 0 26px rgba(240,217,168,0.15);}
  .moon-visual svg{display:block;width:100%;height:100%;}
  .moon-summary h2{color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.15rem;font-weight:500;}
  .muted{margin-top:0.3rem;color:var(--ink-dim);font-size:0.68rem;}
  .moon-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.75rem;padding:1rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .moon-stats>div{min-width:0;}
  .stat-label{display:block;margin-bottom:0.35rem;color:var(--ink-dim);font-size:0.53rem;letter-spacing:0.1em;}
  .moon-stats strong{color:var(--ink);font-size:clamp(0.75rem,1.1vw,0.95rem);font-weight:600;overflow-wrap:anywhere;}
  .text-link{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:1rem;color:var(--gold-soft);font-size:0.68rem;text-decoration:none;}
  .text-link:hover{color:white;}
  @media (max-width: 900px){
    .hero{align-items:center;}
    .hero-bottom{flex-direction:column; align-items:center; text-align:center; padding-bottom:2.4rem;}
    .hero-content{max-width:100%;}
    .hero-sub{margin:0 auto;}
    .moon-card{position:relative; right:auto; bottom:auto; width:min(480px,100%); text-align:left;}
    .moon-visual{width:58px; height:58px; flex-basis:58px;}
    .navlinks{gap:0.9rem;}
    .navlinks a{font-size:0.6rem;}
    nav{grid-template-columns:auto 1fr; padding:16px 5vw;}
    .navlinks{justify-self:end;}
    .brand{font-size:1.2rem;}
  }
</style>
</head>
<body>

<nav>
  <div class="brand">Lune</div>
  <ul class="navlinks">
    <li><a href="#accueil">Accueil</a></li>
    <li><a href="photos.html">Photos</a></li>
    <li><a href="materiel.html">Matériel</a></li>
    <li><a href="widget.html">Widget</a></li>
  </ul>
</nav>

<section class="hero" id="accueil">
  <img class="hero-img" src="fond%20d%27%C3%A9cran/hero.jpg" alt="Coucher de soleil sur un champ, photographié depuis la route">
  <div class="hero-overlay"></div>

  <div class="hero-bottom">
    <div class="hero-content">
      <div class="eyebrow">Ce que je photographie</div>
<h1>De la Terre jusqu'à <em>la Lune.</em></h1>
      <p class="hero-sub">Mes photos du ciel et de la Nature.</p>
    </div>

    <aside class="moon-card" id="widget" aria-label="Informations lunaires en direct">
      <div class="moon-card-head"><span>LA LUNE MAINTENANT</span><span class="live-dot">EN DIRECT</span></div>
      <div class="moon-summary">
        <div id="moon-visual" class="moon-visual" aria-label="Illustration de la phase lunaire" title="Calcul en cours…"></div>
        <div><h2 id="phase-name">Calcul en cours…</h2><p id="moon-date" class="muted">Calcul en cours…</p></div>
      </div>
      <div class="moon-stats">
        <div><span class="stat-label">ÉCLAIRÉE</span><strong id="illumination">—</strong></div>
        <div><span class="stat-label">DISTANCE</span><strong id="distance">—</strong></div>
        <div><span class="stat-label">ÂGE</span><strong id="age">—</strong></div>
      </div>
      <a class="text-link" href="widget.html">En savoir plus sur les données <span aria-hidden="true">→</span></a>
    </aside>
  </div>
</section>

<script src="astronomy.min.js"></script>
<script>
/* ---------- Widget lunaire repris de Lune-Site ---------- */
function getPhaseName(phase){
  const angle=((phase%360)+360)%360;
  if(angle<8||angle>=352)return "Nouvelle lune";
  if(angle<82)return "Premier croissant";
  if(angle<98)return "Premier quartier";
  if(angle<172)return "Gibbeuse croissante";
  if(angle<188)return "Pleine lune";
  if(angle<262)return "Gibbeuse décroissante";
  if(angle<278)return "Dernier quartier";
  return "Dernier croissant";
}
function drawMoon(phase,illumination){
  const moon=document.getElementById("moon-visual");
  if(!moon)return;
  const angle=((phase%360)+360)%360;
  const cosine=Math.cos(angle*Math.PI/180);
  const radius=Math.abs(cosine*48).toFixed(2);
  let litShape;
  if(illumination>0.999){litShape='<circle cx="50" cy="50" r="48" fill="#eee5ce" />';}
  else if(angle<180){const sweep=cosine>=0?1:0;litShape='<path d="M 50 2 A 48 48 0 0 1 50 98 A '+radius+' 48 0 0 '+sweep+' 50 2 Z" fill="#eee5ce" />';}
  else{const sweep=cosine>0?1:0;litShape='<path d="M 50 2 A 48 48 0 0 0 50 98 A '+radius+' 48 0 0 '+sweep+' 50 2 Z" fill="#eee5ce" />';}
  moon.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="moon-disc"><circle cx="50" cy="50" r="48"></circle></clipPath></defs><circle cx="50" cy="50" r="48" fill="#171a24"></circle><g clip-path="url(#moon-disc)">'+litShape+'<g fill="#a99d82" opacity=".48"><circle cx="32" cy="33" r="4"></circle><circle cx="68" cy="61" r="6"></circle><circle cx="42" cy="72" r="2.8"></circle><circle cx="60" cy="27" r="2.3"></circle></g></g></svg>';
  moon.setAttribute("title",getPhaseName(angle)+" — "+Math.round(illumination*100)+" % éclairée");
}
function updateMoon(){
  const now=new Date();
  const phaseElement=document.getElementById("phase-name");
  const dateElement=document.getElementById("moon-date");
  if(dateElement)dateElement.textContent=new Intl.DateTimeFormat("fr-FR",{dateStyle:"full",timeStyle:"short"}).format(now);
  if(!window.Astronomy){if(phaseElement)phaseElement.textContent="Données momentanément indisponibles";return;}
  try{
    const phase=Astronomy.MoonPhase(now);
    const illumination=(1-Math.cos(phase*Math.PI/180))/2;
    const previousNewMoon=Astronomy.SearchMoonPhase(0,now,-35);
    const ageInDays=Math.max(0,(now.getTime()-previousNewMoon.date.getTime())/86400000);
    const distanceInKm=Astronomy.Libration(now).dist_km;
    if(phaseElement)phaseElement.textContent=getPhaseName(phase);
    document.getElementById("illumination").textContent=Math.round(illumination*100)+" %";
    document.getElementById("distance").textContent=Math.round(distanceInKm).toLocaleString("fr-FR")+" km";
    document.getElementById("age").textContent=ageInDays.toFixed(1).replace(".",",")+" jours";
    drawMoon(phase,illumination);
  }catch(error){if(phaseElement)phaseElement.textContent="Données momentanément indisponibles";console.error("Calcul lunaire indisponible",error);}
}
updateMoon();
setInterval(updateMoon,60000);
</script>

</body>
</html>
